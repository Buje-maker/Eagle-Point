<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Happy Thanksgiving | Eagle Point Outdoor Services</title>
<meta name="theme-color" content="#142A3B">
<meta property="og:title" content="Happy Thanksgiving from Eagle Point">
<meta property="og:image" content="https://eaglepoint.buje.io/assets/thanksgiving-2026-poster.jpg">
<link rel="icon" href="assets/logo-icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Oswald:wght@500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
<style>
.tp-head{background:var(--ivory);border-bottom:1px solid #E6E1D3}
.tp-head .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:14px}
.tp-head .btn.small{background:var(--navy);color:var(--ivory)}
.tg{max-width:860px;margin:0 auto;padding:48px 0 56px;text-align:center}
.tg h1{font-family:var(--display);font-weight:700;font-size:clamp(34px,6vw,52px);text-transform:uppercase;color:var(--navy);line-height:1.05;margin-bottom:12px}
.tg p{color:var(--muted);font-size:19px;margin-bottom:26px}
.tg video{width:100%;border-radius:12px;border:3px solid var(--gold);background:var(--deep);box-shadow:0 10px 30px rgba(20,42,59,.18)}
.tg .sig{margin-top:26px;color:var(--ink)}
</style>
</head>
<body>
<header class="tp-head">
  <div class="wrap">
    <a class="brand" href="/" aria-label="Eagle Point Outdoor Services, home">
      <img src="assets/eagle-logo.png" alt="" width="44" height="44">
      <span><b style="color:var(--navy)">EAGLE POINT</b><small style="color:#5B6770">OUTDOOR SERVICES</small></span>
    </a>
    <a class="btn small" href="tel:+15074948960">Call / Text Us</a>
  </div>
</header>
<main class="wrap">
  <section class="tg">
    <h1>Happy Thanksgiving</h1>
    <p>A little sketch from our driveway to yours. Tap the video for sound.</p>
    <video src="assets/thanksgiving-2026.mp4" poster="assets/thanksgiving-2026-poster.jpg" controls autoplay muted loop playsinline preload="auto"></video>
    <p class="sig">Thank you for trusting us with your winter.<br><b>Nicolas, Eagle Point Outdoor Services</b></p>
  </section>
</main>
</body>
</html>
